spring:
  application:
    name: dodoong

  # Flyway (Phase 3 도입): 스키마는 V1~ 마이그레이션이 관리.
  # 이미 ddl-auto로 스키마가 만들어진 기존 DB는 V1(baseline)을 건너뛰고 V2부터 적용.
  flyway:
    baseline-on-migrate: true
    baseline-version: 1

aws:
  s3:
    bucket: ${AWS_S3_BUCKET:dodoong-static}
    region: ${AWS_REGION:ap-northeast-2}
    base-url: ${AWS_S3_BASE_URL:https://dodoong-static.s3.ap-northeast-2.amazonaws.com}
    presign-expiration: ${AWS_S3_PRESIGN_EXPIRATION:5m}